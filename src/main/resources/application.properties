spring.application.name=VetCare

spring.datasource.url=jdbc:mysql://localhost:3306/vet_care?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# para criação das tabelas no banco, atualização automática
# SQL DDL data definition language
spring.jpa.hibernate.ddl-auto=update
# Para Debug: mostra código sql gerado
spring.jpa.show-sql=true


# Caminho para acessar a interface do Swagger no navegador
springdoc.swagger-ui.path=/swagger-ui.html
# Caminho para o arquivo JSON da especificação OpenAPI
springdoc.api-docs.path=/v3/api-docs